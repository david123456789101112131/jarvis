[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "JARVIS — a Windows desktop AI assistant with a central orchestrator and five specialist agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "JARVIS project" }]
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "psutil>=5.9",
  "keyring>=24",
  "platformdirs>=4",
  "tomli-w>=1.0",
  "beautifulsoup4>=4.12",
  "send2trash>=1.8",
  "pypdf>=4",
]

[project.optional-dependencies]
ai = ["anthropic>=1.11", "openai>=1.40"]
voice = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "webrtcvad-wheels>=2.0.11",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17",
  "faster-whisper>=1.0",
  "edge-tts>=6.1",
  "pyttsx3>=2.90",
  "miniaudio>=1.59",
]
desktop = ["pywebview>=5.0"]
windows = ["pywin32>=306; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'"]
creative = ["pillow>=10", "python-pptx>=1.0"]
all = ["jarvis-assistant[ai,voice,desktop,windows,creative]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "playwright>=1.44",
  "pyinstaller>=6.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = [
  "config/*.toml",
  "ui/static/**/*",
  "agents/development/templates/**/*",
  "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "slow: long-running tests",
  "voice_models: needs downloaded wake-word/STT models (skipped when unavailable)",
  "network: needs internet access (skipped when offline)",
  "windows: runs only on Windows",
  "e2e: drives the real UI in a browser",
]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "ASYNC109", "ASYNC110", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# Generated-project templates import their own top-level packages ("app", "bot"), which ruff would
# otherwise sort as third-party code from this repository's point of view.
"src/jarvis/agents/development/templates/**" = ["I001"]
# Tests check the files the agents wrote; a blocking read inside an async test is harmless there.
"tests/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
packages = ["jarvis"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
