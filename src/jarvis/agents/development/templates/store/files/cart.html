<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ui.cart }} · {{ brand }}</title>
  <meta name="theme-color" content="{{ colors.primary }}">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/store.css">
</head>
<body data-page="cart">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark">{{ initials }}</span>{{ brand }}</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">☰<span class="sr-only">{{ ui.menu }}</span></button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">{{ ui.shop }}</a>
        <a class="cart-link" href="cart.html" aria-current="page">🛒 {{ ui.cart }} <span class="badge" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1 class="page-title">{{ ui.cart_title }}</h1>
    <div class="cart-layout">
      <div id="cart-lines"></div>
      <aside class="summary" id="summary" aria-live="polite"></aside>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap"><span>© {{ year }} {{ brand }} · {{ ui.footer }}</span><span>{{ email }} · {{ phone }}</span></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>window.STORE_UI = {{ ui|json }};</script>
  <script src="data/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
